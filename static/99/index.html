<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel2: #23262e;
    --border: #33373f;
    --faint: #23262e;
    --text: #e8eaed;
    --muted: #8b919c;
    --accent: #4da3ff;
    --pos: #4ecb71;
    --neg: #ff6b6b;
    --fs: clamp(15px, 1.5vw, 30px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--fs);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: .6em;
    flex-wrap: wrap;
    padding: .5em .8em;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.1em; margin: 0; letter-spacing: .02em; }
  .who { color: var(--muted); font-size: .8em; margin-left: auto; display: flex; align-items: center; gap: .6em; }
  .who b { color: var(--text); }
  .who button { font-size: 1em; }

  .controls {
    display: flex;
    gap: .5em;
    padding: .5em .8em;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }
  input, button {
    font: inherit;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: .4em;
    padding: .45em .7em;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { cursor: pointer; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1420; font-weight: 600; }
  #score { width: 7em; }
  #status { margin-left: auto; font-size: .7em; color: var(--muted); white-space: nowrap; }
  #status.err { color: var(--neg); }

  .tablewrap { flex: 1; overflow: auto; }

  .grid { display: grid; }
  .cell { padding: .4em .6em; text-align: center; white-space: nowrap; }

  .hdr { position: sticky; top: 0; z-index: 6; }
  .hdr .cell {
    background: var(--panel2);
    border-bottom: 2px solid var(--border);
    font-size: 1.05em;
    font-weight: 700;
  }
  .hdr .cell.me { color: var(--accent); }

  .cell.axis {
    position: sticky;
    left: 0;
    z-index: 5;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .hdr .cell.axis, .ftr .cell.axis { background: var(--panel2); }

  .canvas { position: relative; }
  .axiscol {
    position: sticky;
    left: 0;
    z-index: 4;
    background: var(--panel);
    border-right: 1px solid var(--border);
  }
  .tick {
    position: absolute;
    right: .4em;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: .7em;
    white-space: nowrap;
  }
  .tickline {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--faint);
    pointer-events: none;
    z-index: 0;
  }
  .col { position: relative; border-right: 1px solid var(--faint); z-index: 1; }

  .chip {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: .05em .45em;
    border-radius: 1em;
    font-weight: 600;
    white-space: nowrap;
    z-index: 2;
  }
  .signedin .chip { cursor: pointer; }
  .signedin .chip:hover { outline: 1px solid var(--border); background: var(--panel2); }
  .chip.pos { color: var(--pos); }
  .chip.neg { color: var(--neg); }
  .chip.zero { color: var(--muted); }
  .chip.editing {
    display: flex;
    gap: .3em;
    align-items: center;
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: .3em .4em;
    z-index: 10;
    cursor: default;
  }
  .chip.editing input { width: 3.5em; padding: .2em .3em; text-align: center; }
  .chip.editing button { padding: .2em .45em; font-size: .85em; }
  .chip.editing .del { color: var(--neg); }

  .ftrblock { position: sticky; bottom: 0; z-index: 6; }
  .ftrblock .cell { background: var(--panel2); border-top: 1px solid var(--border); }
  .ftr.total .cell { font-weight: 700; font-size: 1.15em; }
  .ftr.avg .cell { color: var(--muted); }
  .ftr .cell.axis { font-weight: 600; font-size: .78em; color: var(--text); display: flex; align-items: center; justify-content: flex-end; }

  .hint { color: var(--muted); text-align: center; padding: 2em 1em; font-size: .9em; }

  #overlay[hidden] { display: none; }
  #overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #overlay form {
    display: flex;
    flex-direction: column;
    gap: .8em;
    width: min(20em, 85vw);
  }
  #overlay h1 { margin: 0 0 .2em; font-size: 1.4em; text-align: center; }
  #overlay input, #overlay button { font-size: 1.1em; text-align: center; }
</style>
</head>
<body>

<div id="overlay" hidden>
  <form id="loginForm">
    <h1>🏆 Scoreboard</h1>
    <input id="nameInput" placeholder="your name" autocomplete="off" maxlength="24">
    <button class="primary" type="submit">Sign in</button>
    <button type="button" id="watchBtn">just watch</button>
  </form>
</div>

<header>
  <h1>🏆 Scoreboard</h1>
  <span class="who">signed in as <b id="whoName"></b> <button id="signOut">sign out</button></span>
</header>

<div class="controls">
  <input id="score" type="number" step="1" inputmode="numeric" placeholder="points" autocomplete="off">
  <button id="negate" title="flip sign">±</button>
  <button id="add" class="primary">Add score</button>
  <span id="status">connecting…</span>
</div>

<div class="tablewrap" id="tablewrap"></div>

<script>
const API = 'https://jsonblob.com/api/jsonBlob/019fe835-f6ad-7b29-bfc3-54ec4f4f4ec0';
const POLL_MS = 3000;
const AXIS_W = '7em';
const COL_MIN = '6em';
const PX_PER_MIN = 4;

let events = {};          // id -> {id, n, s, t, v, del?}
let myName = localStorage.getItem('sb_name') || '';
let watching = new URLSearchParams(location.search).has('watch') ||
               localStorage.getItem('sb_watch') === '1';
let editingId = null;
let pushing = false, pushQueued = false;
let mutGen = 0, savedGen = 0;   // mutation counter vs last successfully saved
let firstRender = true;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mergeIn(arr) {
  for (const e of arr || []) {
    if (!e || !e.id) continue;
    const cur = events[e.id];
    if (!cur) { events[e.id] = e; continue; }
    const cv = cur.v || 0, ev = e.v || 0;
    if (ev > cv || (ev === cv && e.del && !cur.del)) events[e.id] = e;
  }
}

function setStatus(msg, err) {
  const el = $('status');
  el.textContent = msg;
  el.className = err ? 'err' : '';
}

async function pull() {
  try {
    const r = await fetch(API, {headers: {Accept: 'application/json'}});
    if (!r.ok) throw new Error(r.status);
    mergeIn((await r.json()).events);
    setStatus('live');
    render();
  } catch (e) {
    setStatus('connection error — retrying', true);
  }
}

async function push() {
  if (pushing) { pushQueued = true; return; }
  pushing = true;
  const gen = mutGen;
  try {
    const r = await fetch(API, {headers: {Accept: 'application/json'}});
    if (r.ok) mergeIn((await r.json()).events);
    const w = await fetch(API, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({events: Object.values(events)}),
    });
    if (!w.ok) throw new Error(w.status);
    savedGen = Math.max(savedGen, gen);
    setStatus('live');
  } catch (e) {
    setStatus('save failed — retrying', true);
    setTimeout(() => { pushing = false; push(); }, 2000 + Math.random() * 1000);
    return;
  }
  pushing = false;
  if (pushQueued) { pushQueued = false; push(); }
}

// best-effort flush of unsaved scores if the tab is closed mid-retry
window.addEventListener('pagehide', () => {
  if (mutGen === savedGen) return;
  fetch(API, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({events: Object.values(events)}),
    keepalive: true,
  }).catch(() => {});
});

function fmtTime(t) {
  return new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
}
function fmtAvg(total, n) {
  if (!n) return '—';
  return (Math.round(total / n * 100) / 100).toLocaleString();
}
function fmtScore(s) { return (s > 0 ? '+' : '') + s; }

function render() {
  if (editingId) return;   // don't clobber an open editor; resumes on close

  const live = Object.values(events).filter(e => !e.del).sort((a, b) => a.t - b.t);

  const players = {};
  if (myName) players[myName] = {total: 0, count: 0};
  for (const e of live) {
    (players[e.n] ??= {total: 0, count: 0});
    players[e.n].total += e.s;
    players[e.n].count++;
  }
  const names = Object.keys(players)
    .sort((a, b) => players[b].total - players[a].total || a.localeCompare(b));

  const wrap = $('tablewrap');
  const nearBottom = firstRender ||
    wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;

  if (!names.length) {
    wrap.innerHTML = '<div class="hint">No scores yet — sign in and add one!</div>';
    return;
  }

  // time axis: from first score (rounded down to a tick) until now
  const now = Date.now();
  const first = live.length ? live[0].t : now;
  const steps = [5, 10, 15, 30, 60, 120].map(m => m * 60000);
  const rawSpan = Math.max(now - first, 10 * 60000);
  const step = steps.find(s => rawSpan / s <= 12) || steps.at(-1);
  const start = Math.floor(first / step) * step;
  const span = Math.max(now - start, 10 * 60000);
  const H = Math.max(wrap.clientHeight - 1, span / 60000 * PX_PER_MIN);
  const yOf = t => (t - start) / span * H;

  const gtc = `grid-template-columns:${AXIS_W} repeat(${names.length}, minmax(${COL_MIN}, 1fr))`;

  let h = `<div class="grid hdr" style="${gtc}"><div class="cell axis"></div>`;
  for (const n of names)
    h += `<div class="cell ${n === myName ? 'me' : ''}">${esc(n)}</div>`;
  h += '</div>';

  h += `<div class="canvas grid" style="${gtc};height:${H}px">`;
  h += '<div class="axiscol">';
  for (let t = start + step; t <= start + span; t += step)
    h += `<div class="tick" style="top:${yOf(t)}px">${fmtTime(t)}</div>`;
  h += '</div>';

  for (const n of names) {
    h += '<div class="col">';
    let prevBottom = -1e9;
    const CHIP_H = 26;
    for (const e of live) {
      if (e.n !== n) continue;
      let y = Math.max(yOf(e.t), prevBottom + CHIP_H / 2 + 2);
      prevBottom = y + CHIP_H / 2;
      const cls = e.s > 0 ? 'pos' : e.s < 0 ? 'neg' : 'zero';
      h += `<div class="chip ${cls}" data-id="${e.id}" style="top:${y}px"` +
           ` title="${esc(e.n)} ${fmtScore(e.s)} at ${fmtTime(e.t)}">${fmtScore(e.s)}</div>`;
    }
    h += '</div>';
  }
  for (let t = start + step; t <= start + span; t += step)
    h += `<div class="tickline" style="top:${yOf(t)}px"></div>`;
  h += '</div>';

  h += `<div class="ftrblock"><div class="grid ftr total" style="${gtc}"><div class="cell axis">Total Score</div>`;
  for (const n of names) h += `<div class="cell">${players[n].total.toLocaleString()}</div>`;
  h += `</div><div class="grid ftr avg" style="${gtc}"><div class="cell axis">Score Per Game</div>`;
  for (const n of names) h += `<div class="cell">${fmtAvg(players[n].total, players[n].count)}</div>`;
  h += '</div></div>';

  wrap.innerHTML = h;
  wrap.classList.toggle('signedin', !!myName);

  if (nearBottom) wrap.scrollTop = wrap.scrollHeight;
  firstRender = false;
}

function openEditor(chip, id) {
  const e = events[id];
  if (!e || e.del) return;
  editingId = id;
  chip.className = 'chip editing';
  chip.innerHTML = `<input type="number" step="1" inputmode="numeric" value="${e.s}">` +
    '<button class="save primary" title="save">✓</button>' +
    '<button class="del" title="delete">🗑</button>' +
    '<button class="cancel" title="cancel">✕</button>';
  const inp = chip.querySelector('input');
  inp.focus();
  inp.select();
}

function closeEditor(save, del) {
  const id = editingId;
  if (!id) return;
  const chip = document.querySelector('.chip.editing');
  editingId = null;
  const e = events[id];
  if (e && del) {
    events[id] = {...e, del: true, v: (e.v || 0) + 1};
    mutGen++;
    push();
  } else if (e && save && chip) {
    const raw = chip.querySelector('input').value.trim();
    if (/^[+-]?\d+$/.test(raw) && parseInt(raw, 10) !== e.s) {
      events[id] = {...e, s: parseInt(raw, 10), v: (e.v || 0) + 1};
      mutGen++;
      push();
    }
  }
  render();
}

function addScore() {
  const raw = $('score').value.trim();
  if (!/^[+-]?\d+$/.test(raw)) { $('score').focus(); return; }
  const e = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    n: myName,
    s: parseInt(raw, 10),
    t: Date.now(),
    v: 0,
  };
  events[e.id] = e;
  mutGen++;
  $('score').value = '';
  render();
  push();
}

function applyAuth() {
  const signedIn = !!myName;
  $('overlay').hidden = signedIn || watching;
  $('whoName').textContent = signedIn ? myName : 'nobody (watching)';
  $('signOut').textContent = signedIn ? 'sign out' : 'sign in';
  $('score').hidden = $('negate').hidden = $('add').hidden = !signedIn;
  if (!signedIn && !watching) $('nameInput').focus();
  render();
}

$('loginForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const n = $('nameInput').value.trim();
  if (!n) return;
  myName = n;
  localStorage.setItem('sb_name', n);
  applyAuth();
});

$('signOut').addEventListener('click', () => {
  myName = '';
  watching = false;
  closeEditor(false);
  localStorage.removeItem('sb_name');
  localStorage.removeItem('sb_watch');
  applyAuth();
});

$('watchBtn').addEventListener('click', () => {
  watching = true;
  localStorage.setItem('sb_watch', '1');
  applyAuth();
});

$('add').addEventListener('click', addScore);
$('score').addEventListener('keydown', ev => { if (ev.key === 'Enter') addScore(); });

$('negate').addEventListener('click', () => {
  const v = $('score').value.trim();
  if (v.startsWith('-')) $('score').value = v.slice(1);
  else if (v) $('score').value = '-' + v;
  $('score').focus();
});

$('tablewrap').addEventListener('click', ev => {
  const chip = ev.target.closest('.chip');
  if (!myName) return;
  if (chip && !chip.classList.contains('editing')) {
    closeEditor(false);
    openEditor(chip, chip.dataset.id);
    return;
  }
  if (chip && chip.classList.contains('editing')) {
    if (ev.target.closest('.save')) closeEditor(true);
    else if (ev.target.closest('.del')) closeEditor(false, true);
    else if (ev.target.closest('.cancel')) closeEditor(false);
  }
});

$('tablewrap').addEventListener('keydown', ev => {
  if (!editingId) return;
  if (ev.key === 'Enter') { ev.preventDefault(); closeEditor(true); }
  if (ev.key === 'Escape') closeEditor(false);
});

applyAuth();
pull();
setInterval(pull, POLL_MS + Math.random() * 800);
</script>
</body>
</html>
